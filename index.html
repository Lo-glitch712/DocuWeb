<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocuFrame</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
<header><div class="brand"><strong>DF</strong><div><b>DocuFrame</b><small>Documentation Studio</small></div></div>
<div class="actions"><button id="pick" class="primary">＋ Import Photos</button><button id="cam">📷 Camera</button><button id="tpl">🖼 Template</button><input id="files" type="file" multiple accept="image/png,image/jpeg,image/jpg,image/webp" hidden></div></header>
<div class="layout">
<aside><div class="head">PHOTOS <span id="count">0</span></div><div id="photos" class="photos"></div><div id="drop" class="drop">Drop images here<br><small>PNG · JPG · JPEG · WebP</small></div></aside>
<main><div class="stage"><canvas id="canvas" width="940" height="788"></canvas><div id="empty">Import a photo to begin</div></div><div class="toolbar">
<span id="status">Ready</span>
<select id="resolution" title="Output resolution">
<option value="940x788">940 × 788</option>
<option value="1280x1073">1280 × 1073</option>
<option value="1920x1609" selected>1920 × 1609</option>
<option value="original">Original photo</option>
<option value="custom">Custom…</option>
</select>
<input id="customW" class="custom-size hidden" type="number" min="100" max="8000" value="1920" placeholder="W">
<span class="times hidden" id="times">×</span>
<input id="customH" class="custom-size hidden" type="number" min="100" max="8000" value="1609" placeholder="H">
<button id="reset">Reset</button><button id="save">Save JPG</button></div></main>
<section class="panel"><div class="tabs"><button class="active" data-tab="edit">Edit</button><button data-tab="info">Info</button></div>
<div id="edit"><label>Zoom <output id="zv">100%</output><input id="zoom" type="range" min=".2" max="4" step=".01" value="1"></label><label>X <output id="xv">0</output><input id="x" type="range" min="-900" max="900" value="0"></label><label>Y <output id="yv">0</output><input id="y" type="range" min="-700" max="700" value="0"></label><label>Rotation <output id="rv">0°</output><input id="rot" type="range" min="-180" max="180" value="0"></label><label>Brightness <input id="bright" type="range" min=".5" max="1.5" step=".01" value="1"></label><label>Contrast <input id="contrast" type="range" min=".5" max="1.5" step=".01" value="1"></label></div>
<div id="info" class="hidden"><label>Project<input id="project" placeholder="Project / location"></label><label>Custom text<input id="custom" placeholder="Optional"></label></div></section>
</div></div>
<div id="modal" class="modal hidden"><div class="card"><div class="modalhead">Overlay Template <button id="closeTpl">×</button></div><label class="upload">＋ Choose transparent PNG<input id="templateFile" type="file" accept="image/png" hidden></label><img id="templatePreview"></div></div>
<div id="cameraModal" class="modal hidden"><div class="card camera"><div class="modalhead">Camera <button id="closeCam">×</button></div><div class="camstage"><video id="video" autoplay playsinline></video><canvas id="live" width="940" height="788"></canvas></div><button id="capture" class="capture">● Capture</button></div></div>
<script src="app.js"></script></body></html>
